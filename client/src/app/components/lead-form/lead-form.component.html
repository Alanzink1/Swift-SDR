<div class="modal-container">
  <header class="modal-header">
    <h2>🎯 Novo Lead</h2>
    <button class="btn-close" (click)="close()">&times;</button>
  </header>

  <form [formGroup]="leadForm" (ngSubmit)="onSubmit()" class="modal-form">
    <div class="form-grid">
      <div class="form-group">
        <label for="name">Nome Completo *</label>
        <input id="name" type="text" formControlName="name" placeholder="Ex: Alan Rodrigues">
      </div>

      <div class="form-group">
        <label for="email">E-mail Corporativo *</label>
        <input id="email" type="email" formControlName="email" placeholder="email@empresa.com">
      </div>

      <div class="form-group">
        <label for="phone">Telefone</label>
        <input id="phone" type="text" formControlName="phone" placeholder="(11) 99999-9999">
      </div>

      <div class="form-group">
        <label for="company">Empresa</label>
        <input id="company" type="text" formControlName="company" placeholder="Nome da Empresa">
      </div>

      <div class="form-group">
        <label for="job_title">Cargo</label>
        <input id="job_title" type="text" formControlName="job_title" placeholder="Ex: Diretor de Vendas">
      </div>

      <div class="form-group">
        <label for="current_stage_id">Etapa Inicial *</label>
        <select id="current_stage_id" formControlName="current_stage_id">
          @for (stage of stages(); track stage.id) {
            <option [value]="stage.id">{{ stage.name }}</option>
          }
        </select>
      </div>
    </div>

    <!-- Seção de Campos Personalizados -->
    <div class="custom-fields-section">
      <h3>💎 Campos Estratégicos (Workspace)</h3>
      <div class="form-group">
        <label for="revenue">Faturamento Anual (Sample Custom Field)</label>
        <input id="revenue" type="number" formControlName="revenue" placeholder="0.00">
      </div>
    </div>

    @if (errorMessage()) {
      <div class="error-msg">{{ errorMessage() }}</div>
    }

    <footer class="modal-actions">
      <button type="button" class="btn-ghost" (click)="close()" [disabled]="isSaving()">Cancelar</button>
      <button type="submit" class="btn-primary" [disabled]="leadForm.invalid || isSaving()">
        @if (isSaving()) {
          <span class="spinner"></span> Processando...
        } @else {
          Cadastrar Lead
        }
      </button>
    </footer>
  </form>
</div>
